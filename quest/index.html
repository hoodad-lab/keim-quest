<style>

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);padding:16px;margin:0}
.wrap{max-width:max(640px,min(1800px,calc((100vh - 150px) * 320 / 176)));max-width:max(640px,min(1800px,calc((100dvh - 150px) * 320 / 176)));margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;background:var(--red);padding:4px 6px;border:3px solid #000}
.logo svg{width:62px;height:50px;flex:none;display:block}
.logo b{font-family:var(--brand);font-weight:400;font-size:26px;letter-spacing:.02em;color:#1a1a1a;line-height:1}
h1{font-size:13px;margin:0;letter-spacing:.04em;line-height:1.5}
h1 span{color:var(--mute);font-size:9px;display:block;margin-top:2px}
.spacer{flex:1}
.mute{font-family:var(--font);font-size:10px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:10px 12px;cursor:pointer}
.mute:focus-visible,.pad button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:320/176;background:#000;border:4px solid #000;outline:3px solid var(--red);box-sizing:border-box}
canvas{width:100%;height:100%;display:block;touch-action:none}
.stage:fullscreen{display:flex;align-items:center;justify-content:center;border:0;outline:0;background:#000;aspect-ratio:auto}
.stage:fullscreen canvas{width:min(100vw,calc(100vh * 320 / 176));height:auto;aspect-ratio:320/176}
.stage:-webkit-full-screen{display:flex;align-items:center;justify-content:center;border:0;outline:0;background:#000;aspect-ratio:auto}
.stage:-webkit-full-screen canvas{width:min(100vw,calc(100vh * 320 / 176));height:auto}
.pad{display:none;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none;touch-action:none;padding-block:4px}
.pad .grp{display:flex;gap:14px}
.pad button{font-family:var(--font);width:74px;height:74px;border-radius:50%;border:3px solid #000;background:var(--panel);color:var(--ink);font-size:18px;box-shadow:0 4px 0 #000;touch-action:none}
.pad button.a{background:var(--red);color:#fff;font-size:11px}
.pad button.b{background:#e9e3d8;color:#111;font-size:10px}
.pad button.on{transform:translateY(3px);box-shadow:0 1px 0 #000}
@media (pointer:coarse){.pad{display:flex}}
.help{font-size:9px;line-height:2;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 22px}
.help b{color:var(--ink);font-weight:400}
footer{font-size:9px;color:var(--mute);line-height:2}
footer a{color:var(--ink)}
</style>

 X.fillStyle='rgba(12,14,20,.8)';X.fillRect(x-tw/2-7,sy,tw+14,bh);txt(p.s,x,sy+6,z,p.col,'center');X.globalAlpha=1});X.restore()}
const KL={K:{w:1.0,p:[[[0,0],[.44,0],[.44,1],[0,1]],[[.36,.38],[.64,1],[1,1],[.70,.38]],[[.36,.62],[.66,.62],[1.02,0],[.62,0]]]},
 E:{w:.84,p:[[[0,0],[.46,0],[.46,1],[0,1]],[[0,.77],[1,.77],[1,1],[0,1]],[[0,.39],[.9,.39],[.9,.61],[0,.61]],[[0,0],[1,0],[1,.23],[0,.23]]]},
 I:{w:.44,p:[[[0,0],[1,0],[1,1],[0,1]]]},
 M:{w:1.32,p:[[[0,0],[.32,0],[.32,1],[0,1]],[[.68,0],[1,0],[1,1],[.68,1]],[[0,1],[.34,1],[.5,.6],[.66,1],[1,1],[.64,.22],[.36,.22]]]}};
const KG={wedgeA:30,r0:1.14,r1:1.96,span:34,gap:.1};
function keimLogoPolys(){const tot=['K','E','I','M'].reduce((a,c)=>a+KL[c].w,0)+KG.gap*3,deg=KG.span*2/tot,out=[];let a=-KG.span;
 const P=(ang,r)=>{const q=ang*Math.PI/180;return[r*Math.sin(q),-r*Math.cos(q)]};
 ['K','E','I','M'].forEach(ch=>{const L=KL[ch],a0=a,a1=a+L.w*deg;L.p.forEach(poly=>{const pts=[];for(let i=0;i<poly.length;i++){const [u0,v0]=poly[i],[u1,v1]=poly[(i+1)%poly.length];for(let s=0;s<8;s++){const u=u0+(u1-u0)*s/8,v=v0+(v1-v0)*s/8;pts.push(P(a0+u*(a1-a0),KG.r0+v*(KG.r1-KG.r0)))}}out.push(pts)});a=a1+KG.gap*deg});
 const wd=[[0,0]];for(let s=0;s<=20;s++)wd.push(P(-KG.wedgeA+s*KG.wedgeA*2/20,1));out.push(wd);return out}
const KPOLY=keimLogoPolys();
const KBOX=(()=>{let x0=9,x1=-9,y0=9,y1=-9;KPOLY.forEach(p=>p.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}));return{x0,x1,y0,y1,w:x1-x0,h:y1-y0}})();
function keimLogo(ctx,x,y,w,h,col){const s=Math.min(w/KBOX.w,h/KBOX.h),ox=x+(w-KBOX.w*s)/2-KBOX.x0*s,oy=y+(h-KBOX.h*s)/2-KBOX.y0*s;ctx.save();ctx.fillStyle=col;
 KPOLY.forEach(p=>{ctx.beginPath();p.forEach(([px,py],i)=>i?ctx.lineTo(ox+px*s,oy+py*s):ctx.moveTo(ox+px*s,oy+py*s));ctx.closePath();ctx.fill()});ctx.restore()}
function keimLogoSVG(){return KPOLY.map(p=>'<path d="M'+p.map(([x,y])=>(x*100).toFixed(1)+' '+(y*100).toFixed(1)).join(' L')+' Z"/>').join('')}
function brandBadge(x,y,w,h){X.fillStyle=RED;X.fillRect(x,y,w,h);keimLogo(X,x+w*.1,y+h*.1,w*.8,h*.8,'#fff')}
