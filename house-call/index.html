<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEIM House Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#111214;--panel:#1b1d21;--line:#2a2d33;--ink:#f3efe8;--mute:#a39d94;--red:#d51f24;--font:"Press Start 2P",ui-monospace,Menlo,monospace}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);padding:16px;margin:0}
.wrap{max-width:max(640px,min(1800px,calc((100vh - 150px) * 16 / 9)));max-width:max(640px,min(1800px,calc((100dvh - 150px) * 16 / 9)));margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wrap.tallw{max-width:min(100%,calc((100vh - 120px) * var(--arn,.6207)));max-width:min(100%,calc((100dvh - 120px) * var(--arn,.6207)))}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;background:var(--red);padding:4px;border:3px solid #000}
.logo svg{width:54px;height:54px;display:block}
h1{font-size:13px;margin:0;letter-spacing:.04em;line-height:1.5}
h1 span{color:var(--mute);font-size:9px;display:block;margin-top:2px}
.spacer{flex:1}
.btn{font-family:var(--font);font-size:10px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:10px 12px;cursor:pointer;min-height:44px}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.stage{position:relative;width:100%;aspect-ratio:var(--ar,16/9);background:#000;border:4px solid #000;outline:3px solid var(--red);box-sizing:border-box}
canvas{width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage:fullscreen{display:flex;align-items:center;justify-content:center;border:0;outline:0;aspect-ratio:auto}
.stage:fullscreen canvas{width:min(100vw,calc(100vh * var(--arn,1.7778)));height:auto;aspect-ratio:var(--ar,16/9)}
.stage:-webkit-full-screen{display:flex;align-items:center;justify-content:center;border:0;outline:0;aspect-ratio:auto}
.stage:-webkit-full-screen canvas{width:min(100vw,calc(100vh * var(--arn,1.7778)));height:auto}
@media (pointer:coarse){
 html,body{touch-action:manipulation;overscroll-behavior:none}
 .wrap .help,.wrap footer{display:none}
 body{padding:10px}.wrap{gap:10px}
 #fs{display:none}
 .wrap.tallw header{gap:8px;flex-wrap:nowrap}.wrap.tallw .btn{white-space:nowrap}.wrap.tallw .logo svg{width:34px;height:34px}.wrap.tallw .logo{padding:3px;border-width:2px}.wrap.tallw h1{font-size:9px}.wrap.tallw h1 span{display:none}.wrap.tallw .btn{padding:8px 8px;font-size:8px}
}
@media (pointer:coarse) and (orientation:landscape){
 #fs{display:inline-block}
 body{padding:6px 10px}
 .wrap{max-width:none;gap:6px}
 header{gap:8px}header h1 span{display:none}h1{font-size:10px}.logo svg{width:28px;height:28px}.logo{padding:2px;border-width:2px}.btn{padding:6px 8px;font-size:8px}
 .stage{width:min(100%,calc((100vh - 64px) * 16 / 9));width:min(100%,calc((100dvh - 64px) * 16 / 9));margin:0 auto}
}
.help{font-size:9px;line-height:2;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 22px}
.help b{color:var(--ink);font-weight:400}
footer{font-size:9px;color:var(--mute);line-height:2}
footer a{color:var(--ink)}
</style>
</head><body>
<div class="wrap" id="wrap">
 <header>
  <div class="logo" aria-label="KEIM"><svg id="hlogo" viewBox="0 0 100 100" aria-hidden="true"></svg></div>
  <h1>KEIM HOUSE CALL<span>RIGHT PAINT. RIGHT COLOUR. NO MESS.</span></h1>
  <div class="spacer"></div>
  <button class="btn" id="fs" type="button">FULL SCREEN</button>
  <button class="btn" id="pausebtn" type="button">PAUSE</button>
  <button class="btn" id="mute" type="button">SOUND: ON</button>
 </header>
 <div class="stage" id="stage"><canvas id="game" width="1280" height="720" aria-label="KEIM House Call painting game"></canvas></div>
 <div class="help"><span><b>SWIPE OR TAP</b>  ROLL THAT WAY</span><span><b>ARROWS</b>  ROLL WITH KEYS</span><span><b>U</b>  UNDO</span><span><b>R</b>  RESTART WALL</span><span><b>H</b>  HINT</span><span><b>P / ESC</b>  PAUSE</span><span><b>M</b>  SOUND</span></div>
 <footer>A KEIM arcade game. Pick the right KEIM paint for each surface, match the client&rsquo;s colour and paint room by room before time runs out. &middot; <a href="https://keim.com.au" target="_blank" rel="noopener">keim.com.au</a></footer>
</div>
<script>
(()=>{
// ================= core =================
const cv=document.getElementById('game');const X=cv.getContext('2d');
const W=1280,H=720,RED='#d51f24',DK='#15161a',INK='#f3efe8',MUTE='#a39d94';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k,rnd=(a,b)=>a+Math.random()*(b-a);
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const FNT=s=>s+'px "Press Start 2P", ui-monospace, monospace';
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function txt(s,x,y,size,col,align,shadow){X.font=FNT(size);X.textAlign=align||'left';X.textBaseline='top';if(shadow){X.fillStyle=shadow;X.fillText(s,x+Math.max(2,size/7),y+Math.max(2,size/7))}X.fillStyle=col;X.fillText(s,x,y)}
const TWC=new Map();function tw(s,size){const k=size+'|'+s;let v=TWC.get(k);if(v===undefined){X.font=FNT(size);v=X.measureText(s).width;TWC.set(k,v)}return v}
function wrapText(s,maxW,size){const out=[];let cur='';s.split(' ').forEach(w=>{const t=cur?cur+' '+w:w;if(tw(t,size)>maxW&&cur){out.push(cur);cur=w}else cur=t});if(cur)out.push(cur);return out}
function rrect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const shade=(h,k)=>{const c=hexRGB(h).map(v=>clamp(Math.round(k<0?v*(1+k):v+(255-v)*k),0,255));return'rgb('+c.join(',')+')'};
const lum=h=>{const [r,g,b]=hexRGB(h);return(.299*r+.587*g+.114*b)/255};
// ================= audio =================
let AC=null,master=null,sfxG=null,NB=null,muted=false,lp=null;
try{muted=localStorage.getItem('keim-hc-muted')==='1'}catch(e){}
const muteBtn=document.getElementById('mute');const setMuteLabel=()=>muteBtn.textContent='SOUND: '+(muted?'OFF':'ON');setMuteLabel();
muteBtn.addEventListener('click',()=>{muted=!muted;setMuteLabel();try{localStorage.setItem('keim-hc-muted',muted?'1':'0')}catch(e){}if(master)master.gain.value=muted?0:.32;initAudio();muteBtn.blur()});
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();
 master=AC.createGain();master.gain.value=muted?0:.32;const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
 sfxG=AC.createGain();sfxG.gain.value=.9;sfxG.connect(master);
 NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;loadKV()}catch(e){AC=null}}
function tone(f,d,wave,vol,when,slide){if(!AC)return;const t=AC.currentTime+(when||0);const o=AC.createOscillator(),gn=AC.createGain();o.type=wave||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
 gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.005);gn.gain.setValueAtTime(vol,t+d*.7);gn.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(gn);gn.connect(sfxG);o.start(t);o.stop(t+d+.05)}
function nz(d,vol,when,hp,lowpass,sweepTo){if(!AC)return;const t=AC.currentTime+(when||0);const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=lowpass?'lowpass':'highpass';f.frequency.setValueAtTime(hp||800,t);if(sweepTo)f.frequency.exponentialRampToValueAtTime(sweepTo,t+d);const gn=AC.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(gn);gn.connect(sfxG);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
function loopSet(type,freq,q,vol){if(!AC)return;if(!lp){const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter(),g=AC.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(sfxG);s.start();lp={f,g}}
 const t=AC.currentTime;lp.f.type=type;lp.f.frequency.setTargetAtTime(freq,t,.03);lp.f.Q.setTargetAtTime(q,t,.03);lp.g.gain.setTargetAtTime(vol,t,.04)}
const loopOff=()=>{if(lp&&AC)lp.g.gain.setTargetAtTime(0,AC.currentTime,.05)};
const mf=m=>440*Math.pow(2,(m-69)/12);
const SFX={
 select:()=>{tone(880,.06,'square',.05);tone(1320,.08,'square',.04,.05)},
 move:()=>tone(660,.04,'square',.035),
 right:()=>{[72,76,79,84].forEach((m,i)=>tone(mf(m),.12,'square',.05,i*.07))},
 wrong:()=>{tone(220,.16,'square',.06,0,160);tone(150,.22,'square',.06,.14,110)},
 dip:()=>{nz(.18,.12,0,500,true,140);tone(160,.12,'sine',.08,0,90);tone(520,.06,'sine',.04,.16,700)},
 tape:()=>{nz(.28,.09,0,1800,false,5000);tone(1200,.04,'square',.02,.25)},
 peel:()=>{nz(.35,.1,0,1500,false,6000)},
 mess:()=>{tone(140,.1,'square',.05,0,90);nz(.08,.06,0,300,true)},
 tick:()=>tone(1500,.03,'square',.03),
 star:i=>{tone(mf(79+i*4),.18,'square',.06);tone(mf(91+i*4),.22,'triangle',.04,.05)},
 done:()=>{[60,64,67,72,76,79].forEach((m,i)=>tone(mf(m),.14,'square',.05,i*.08));tone(mf(84),.4,'triangle',.05,.5)},
 thunder:()=>{nz(1.4,.25,0,400,true,60);nz(.3,.2,.05,2000,false)},
 coin:()=>{tone(988,.07,'square',.06);tone(1319,.25,'square',.06,.07)}
};
function sfx(n,a){try{if(AC&&SFX[n])SFX[n](a)}catch(e){}}
// koala voice (ElevenLabs): koala.mp3 holds four short lines, [start, length] in seconds. No file = no voice, nothing else changes.
const KV={paint:[0,1.12],rain:[1.34,2.12],good:[3.64,1.42],oops:[5.26,1.3]};let KVB=null,KVL=0;
function loadKV(){if(KVL||!AC)return;KVL=1;fetch('koala.mp3').then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>new Promise((ok,no)=>{const p=AC.decodeAudioData(b,ok,no);if(p&&p.then)p.then(ok,no)})).then(b=>{KVB=b}).catch(()=>{})}
function say(k){const v=KV[k];if(!AC||!KVB||!v||muted)return;try{const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=2.2;s.buffer=KVB;s.connect(g);g.connect(master);s.start(AC.currentTime+.02,v[0],v[1])}catch(e){}}
// ================= background music: two little chiptune loops (menus / painting) =================
const SONGS={
 menu:{bpm:104,mel:[60,64,67,72,67,64,60,0, 57,60,64,69,64,60,57,0, 53,57,60,65,60,57,53,0, 55,59,62,67,71,67,62,0],
  bas:[36,0,0,0,43,0,0,0, 33,0,0,0,40,0,0,0, 29,0,0,0,36,0,0,0, 31,0,0,0,38,0,0,0],mw:'triangle',mv:.05,bv:.07,hat:0},
 play:{bpm:138,mel:[72,0,76,79,76,0,72,74, 77,0,81,77,76,74,72,0, 74,0,79,74,71,74,79,0, 76,79,84,79,76,0,72,0,
   72,0,76,79,81,79,76,74, 77,81,84,81,77,0,76,74, 74,79,77,74,71,74,67,0, 72,76,79,84,72,0,0,0],
  bas:[48,0,55,0,48,0,55,0, 53,0,60,0,53,0,60,0, 55,0,62,0,55,0,62,0, 48,0,55,0,48,0,55,0,
   48,0,55,0,48,0,55,0, 53,0,60,0,53,0,60,0, 55,0,62,0,55,0,59,0, 48,0,55,0,48,0,48,0],mw:'square',mv:.03,bv:.06,hat:.025}
};
const MUS={song:null,step:0,next:0,g:null};
function mnote(m,d,w,v,t){if(!AC||!m)return;const o=AC.createOscillator(),gn=AC.createGain();o.type=w;o.frequency.setValueAtTime(mf(m),t);
 gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.01);gn.gain.setValueAtTime(v,t+d*.6);gn.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(gn);gn.connect(MUS.g);o.start(t);o.stop(t+d+.05)}
function mhat(v,t){if(!AC||!v)return;const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const gn=AC.createGain();gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0005,t+.05);s.connect(f);f.connect(gn);gn.connect(MUS.g);s.start(t);s.stop(t+.06)}
function musicTick(){if(!AC||AC.state!=='running')return;
 if(!MUS.g){MUS.g=AC.createGain();MUS.g.gain.value=1;MUS.g.connect(master)}
 const want=(typeof G==='undefined'||G.paused||document.hidden)?null:(G.st==='play'?'play':'menu');
 if(want!==MUS.song){MUS.song=want;MUS.step=0;MUS.next=AC.currentTime+.08}
 if(!want)return;const S=SONGS[want],st=60/S.bpm/2;   // one step = an 8th note
 while(MUS.next<AC.currentTime+.25){const i=MUS.step%S.mel.length,t=MUS.next;
  mnote(S.mel[i],st*.9,S.mw,S.mv,t);mnote(S.bas[i%S.bas.length],st*1.8,'triangle',S.bv,t);if(i%2===1)mhat(S.hat,t);
  MUS.step++;MUS.next+=st}}

// ================= KEIM logo (wordmark + wedge) =================
const KL={K:{w:1.0,p:[[[0,0],[.44,0],[.44,1],[0,1]],[[.36,.38],[.64,1],[1,1],[.70,.38]],[[.36,.62],[.66,.62],[1.02,0],[.62,0]]]},
 E:{w:.84,p:[[[0,0],[.46,0],[.46,1],[0,1]],[[0,.77],[1,.77],[1,1],[0,1]],[[0,.39],[.9,.39],[.9,.61],[0,.61]],[[0,0],[1,0],[1,.23],[0,.23]]]},
 I:{w:.44,p:[[[0,0],[1,0],[1,1],[0,1]]]},
 M:{w:1.32,p:[[[0,0],[.32,0],[.32,1],[0,1]],[[.68,0],[1,0],[1,1],[.68,1]],[[0,1],[.34,1],[.5,.6],[.66,1],[1,1],[.64,.22],[.36,.22]]]}};
const KG={wedgeA:30,r0:1.14,r1:1.96,span:34,gap:.1};
function keimLogoPolys(){const tot=['K','E','I','M'].reduce((a,c)=>a+KL[c].w,0)+KG.gap*3,deg=KG.span*2/tot,out=[];let a=-KG.span;
 const P=(ang,r)=>{const q=ang*Math.PI/180;return[r*Math.sin(q),-r*Math.cos(q)]};
 ['K','E','I','M'].forEach(ch=>{const L=KL[ch],a0=a,a1=a+L.w*deg;L.p.forEach(poly=>{const pts=[];for(let i=0;i<poly.length;i++){const [u0,v0]=poly[i],[u1,v1]=poly[(i+1)%poly.length];for(let s=0;s<8;s++){const u=u0+(u1-u0)*s/8,v=v0+(v1-v0)*s/8;pts.push(P(a0+u*(a1-a0),KG.r0+v*(KG.r1-KG.r0)))}}out.push(pts)});a=a1+KG.gap*deg});
 const wd=[[0,0]];for(let s=0;s<=20;s++)wd.push(P(-KG.wedgeA+s*KG.wedgeA*2/20,1));out.push(wd);return out}
const KPOLY=keimLogoPolys();
const KBOX=(()=>{let x0=9,x1=-9,y0=9,y1=-9;KPOLY.forEach(p=>p.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}));return{x0,x1,y0,y1,w:x1-x0,h:y1-y0}})();
function keimLogo(ctx,x,y,w,h,col){const s=Math.min(w/KBOX.w,h/KBOX.h),ox=x+(w-KBOX.w*s)/2-KBOX.x0*s,oy=y+(h-KBOX.h*s)/2-KBOX.y0*s;ctx.save();ctx.fillStyle=col;
 KPOLY.forEach(p=>{ctx.beginPath();p.forEach(([px,py],i)=>i?ctx.lineTo(ox+px*s,oy+py*s):ctx.moveTo(ox+px*s,oy+py*s));ctx.closePath();ctx.fill()});ctx.restore()}
function keimLogoSVG(){return KPOLY.map(p=>'<path d="M'+p.map(([x,y])=>(x*100).toFixed(1)+' '+(y*100).toFixed(1)).join(' L')+' Z"/>').join('')}
function fluff(x,y,r,n,j){X.beginPath();for(let i=0;i<=n;i++){const a=i/n*Math.PI*2,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;if(!i){X.moveTo(px,py);continue}const m=(i-.5)/n*Math.PI*2;X.quadraticCurveTo(x+Math.cos(m)*(r+j*2.2),y+Math.sin(m)*(r+j*2.2),px,py)}X.closePath()}
function kArm(x1,y1,x2,y2){const mx=(x1+x2)/2,my=(y1+y2)/2;X.lineCap='round';
 X.strokeStyle='#3a3836';X.lineWidth=21;X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();
 X.strokeStyle='#a3a8ae';X.lineWidth=15;X.beginPath();X.moveTo(mx,my);X.lineTo(x2,y2);X.stroke();
 X.strokeStyle='#2fa39c';X.beginPath();X.moveTo(x1,y1);X.lineTo(mx,my);X.stroke();
 X.fillStyle='#a3a8ae';X.strokeStyle='#3a3836';X.lineWidth=3;X.beginPath();X.arc(x2,y2,9.5,0,7);X.fill();X.stroke();X.strokeStyle='#3a3836'}
let KHAND=null;
function drawKoala(cx,by,s,t,hold){
 const bob=Math.sin(t*3)*2*s,tilt=Math.sin(t*1.7)*.04,blink=(t%3.6)<.13;X.save();X.translate(cx,by+bob);X.scale(s,s);X.lineJoin='round';X.lineCap='round';X.lineWidth=3;const OL='#3a3836';X.strokeStyle=OL;
 X.fillStyle='rgba(0,0,0,.14)';X.beginPath();X.ellipse(0,2-bob/s,44,9,0,0,7);X.fill();
 // jeans + shoes
 X.fillStyle='#3f679c';[-1,1].forEach(d=>{rrect(X,d*15-12,-30,24,26,8);X.fill();X.stroke()});
 X.fillStyle='#f4f1ea';[-1,1].forEach(d=>{X.beginPath();X.ellipse(d*16,-4,15,8,0,0,7);X.fill();X.stroke()});
 // arms (behind body so shoulders blend)
 [-1,1].forEach(d=>{if(hold&&d>0)return;const sw=Math.sin(t*3+d)*2;kArm(d*24,-76,d*42,-44+sw)});X.lineWidth=3;
 // teal shirt body
 X.fillStyle='#2fa39c';X.beginPath();X.moveTo(-34,-30);X.quadraticCurveTo(-40,-86,0,-90);X.quadraticCurveTo(40,-86,34,-30);X.closePath();X.fill();X.stroke();
 // red apron with white KEIM + paint splats
 X.fillStyle='#d51f24';X.beginPath();X.moveTo(-20,-84);X.lineTo(20,-84);X.lineTo(26,-54);X.quadraticCurveTo(30,-22,24,-20);X.lineTo(-24,-20);X.quadraticCurveTo(-30,-22,-26,-54);X.closePath();X.fill();X.stroke();
 X.strokeStyle='#d51f24';X.lineWidth=4;X.beginPath();X.moveTo(-18,-84);X.lineTo(-24,-96);X.moveTo(18,-84);X.lineTo(24,-96);X.stroke();X.strokeStyle=OL;X.lineWidth=3;
 keimLogo(X,-17,-72,34,20,'#fff');
 [[-14,-36,3.5,'#fff'],[12,-30,2.5,'#fff'],[15,-46,2,'#ffd23f'],[-8,-27,2,'#7fc8ff']].forEach(([x,y,r,c])=>{X.fillStyle=c;X.beginPath();X.arc(x,y,r,0,7);X.fill()});


 if(hold){const sw=Math.sin(t*3)*3;KHAND=[50,-70+sw];kArm(24,-78,50,-70+sw);X.lineWidth=3}
 // head group
 X.save();X.translate(0,-132);X.rotate(tilt);
 // big fluffy ears
 [-1,1].forEach(d=>{X.fillStyle='#a3a8ae';fluff(d*46,-30,29,11,3.2);X.fill();X.stroke();X.fillStyle='#f6b9c8';fluff(d*46,-29,16,9,1.8);X.fill();X.fillStyle='#fff';X.globalAlpha=.7;fluff(d*49,-32,7,7,1.5);X.fill();X.globalAlpha=1});
 // head
 X.fillStyle='#aeb3b9';X.beginPath();X.ellipse(0,0,50,44,0,0,7);X.fill();X.stroke();
