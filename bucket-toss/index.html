<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEIM Bucket Toss</title>

<style>

html,body{background:var(--bg)}

.wrap.tallw{max-width:min(100%,calc((100vh - 120px) * var(--arn,.6207)));max-width:min(100%,calc((100dvh - 120px) * var(--arn,.6207)))}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;background:var(--red);padding:4px;border:3px solid #000}
.logo svg{width:54px;height:54px;display:block}
h1{font-size:13px;margin:0;letter-spacing:.04em;line-height:1.5}
h1 span{color:var(--mute);font-size:9px;display:block;margin-top:2px}
.spacer{flex:1}
.btn{font-family:var(--font);font-size:10px;color:var(--ink);background:var(--panel);border:2px solid var(--line);padding:10px 12px;cursor:pointer;min-height:44px}
.btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.stage{position:relative;width:100%;aspect-ratio:var(--ar,16/9);background:#000;border:4px solid #000;outline:3px solid var(--red);box-sizing:border-box}
canvas{width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage:fullscreen{display:flex;align-items:center;justify-content:center;border:0;outline:0;aspect-ratio:auto}
.stage:fullscreen canvas{width:min(100vw,calc(100vh * var(--arn,1.7778)));height:auto;aspect-ratio:var(--ar,16/9)}
.stage:-webkit-full-screen{display:flex;align-items:center;justify-content:center;border:0;outline:0;aspect-ratio:auto}
.stage:-webkit-full-screen canvas{width:min(100vw,calc(100vh * var(--arn,1.7778)));height:auto}
@media (pointer:coarse){

.help b{color:var(--ink);font-weight:400}
footer{font-size:9px;color:var(--mute);line-height:2}
footer a{color:var(--ink)}

<div class="wrap" id="wrap">
 <header>
  <div class="logo" aria-label="KEIM"><svg id="hlogo" viewBox="0 0 100 100" aria-hidden="true"></svg></div>

 <div class="stage" id="stage"><canvas id="game" width="1280" height="720" aria-label="KEIM Bucket Toss arcade game"></canvas></div>
 <div class="help"><span><b>DRAG BACK + RELEASE</b>  THROW</span><span><b>UP / DOWN or W / S</b>  AIM</span><span><b>HOLD SPACE</b>  CHARGE, RELEASE TO THROW</span><span><b>P / ESC</b>  PAUSE</span><span><b>M</b>  SOUND</span><span><b>ENTER</b>  START</span></div>
 <footer>A KEIM arcade game. Flick the painters&rsquo; kit into the bucket and watch the fan. Cartoon fun only. &middot; <a href="https://keim.com.au" target="_blank" rel="noopener">keim.com.au</a></footer>
</div>
<script>
(()=>{
// ================= core =================
const cv=document.getElementById("game");let X=cv.getContext("2d");
const SS=1;
let W=1280,H=720,TALL=false,LY={};
const RED='#d51f24',DK='#15161a';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,k)=>a+(b-a)*k,rnd=(a,b)=>a+Math.random()*(b-a);
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const FNT=s=>s+'px "Press Start 2P", ui-monospace, monospace';
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function txt(s,x,y,size,col,align,shadow){X.font=FNT(size);X.textAlign=align||'left';X.textBaseline='top';if(shadow){X.fillStyle=shadow;X.fillText(s,x+Math.max(2,size/7),y+Math.max(2,size/7))}X.fillStyle=col;X.fillText(s,x,y)}
const TWC=new Map();function tw(s,size){const k=size+'|'+s;let v=TWC.get(k);if(v===undefined){X.font=FNT(size);v=X.measureText(s).width;TWC.set(k,v)}return v}
const WRC=new Map();function wrapText(s,maxW,size){const key=size+'|'+maxW+'|'+s;const hit=WRC.get(key);if(hit)return hit;const out=[];let cur='';s.split(' ').forEach(w=>{const t=cur?cur+' '+w:w;if(tw(t,size)>maxW&&cur){out.push(cur);cur=w}else cur=t});if(cur)out.push(cur);if(WRC.size>400)WRC.clear();WRC.set(key,out);return out}
function rrect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
const TOUCH=matchMedia('(pointer:coarse)').matches;
// ================= audio =================
let AC=null,master=null,sfxG=null,NB=null,muted=false,lp=null;
try{muted=localStorage.getItem('keim-bt-muted')==='1'}catch(e){}
const muteBtn=document.getElementById('mute');const setMuteLabel=()=>muteBtn.textContent='SOUND: '+(muted?'OFF':'ON');setMuteLabel();
muteBtn.addEventListener('click',()=>{muted=!muted;setMuteLabel();try{localStorage.setItem('keim-bt-muted',muted?'1':'0')}catch(e){}if(master)master.gain.value=muted?0:.32;initAudio();muteBtn.blur()});
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();
 master=AC.createGain();master.gain.value=muted?0:.32;const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
 sfxG=AC.createGain();sfxG.gain.value=.9;sfxG.connect(master);
 NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}catch(e){AC=null}}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,d,wave,vol,when,slide){if(!AC)return;const t=when||AC.currentTime;const o=AC.createOscillator(),gn=AC.createGain();o.type=wave||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
 gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(vol,t+.005);gn.gain.setValueAtTime(vol,t+d*.7);gn.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(gn);gn.connect(sfxG);o.start(t);o.stop(t+d+.05)}
function nz(d,vol,when,hp,lowpass,sweepTo){if(!AC)return;const t=when||AC.currentTime;const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=lowpass?'lowpass':'highpass';f.frequency.setValueAtTime(hp||800,t);if(sweepTo)f.frequency.exponentialRampToValueAtTime(sweepTo,t+d);const gn=AC.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(gn);gn.connect(sfxG);s.start(t,Math.random()*.5);s.stop(t+d+.02)}
// continuous swish / hiss loop driven by tool + speed
function loopSet(type,freq,q,vol){if(!AC)return;if(!lp){const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter(),g=AC.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(sfxG);s.start();lp={f,g}}
 const t=AC.currentTime;lp.f.type=type;lp.f.frequency.setTargetAtTime(freq,t,.03);lp.f.Q.setTargetAtTime(q,t,.03);lp.g.gain.setTargetAtTime(vol,t,.04)}
const loopOff=()=>{if(lp&&AC)lp.g.gain.setTargetAtTime(0,AC.currentTime,.05)};
const now=()=>AC?AC.currentTime:0;
function vox(f0,f1,d,vol,when,fm,q){if(!AC)return;const t=when||AC.currentTime;const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f1,t+d);
 const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=fm||700;bp.Q.value=q||2.2;const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+d*.3);g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(bp);bp.connect(g);g.connect(sfxG);o.start(t);o.stop(t+d+.05)}
const SFX={

 squish:()=>{nz(.12,.1,0,400,true,150);tone(180,.1,'sine',.06,0,110)},
 hollow:()=>{tone(220,.14,'triangle',.12,0,150);nz(.04,.06,0,800,true,300)},
 knock:()=>{tone(420,.07,'square',.08,0,260);tone(260,.09,'triangle',.07,now()+.04,200)},
 rattle:()=>{for(let i=0;i<4;i++)tone(900+Math.random()*300,.03,'square',.03,now()+i*.04)},
 rocket:()=>{nz(.5,.18,0,300,false,2500);tone(120,.5,'sawtooth',.06,0,420)},
 splat:()=>{nz(.2,.2,0,500,true,150);tone(160,.18,'sine',.1,0,60);tone(500,.08,'triangle',.05,now()+.03,250)},
 slam:()=>{tone(90,.4,'sawtooth',.14,0,35);nz(.3,.22,0,300,true,100);tone(mf(79),.2,'square',.06,now()+.1)},
 fever:()=>{[72,76,79,84,88,91,96].forEach((m,i)=>{tone(mf(m),.14,'square',.06,now()+i*.06);tone(mf(m-12),.14,'triangle',.1,now()+i*.06)})},
 feverEnd:()=>{[88,84,79,72].forEach((m,i)=>tone(mf(m),.14,'triangle',.08,now()+i*.07))},
 arp:m=>{tone(mf(m),.09,'square',.035);if(m%12===0)tone(mf(m-24),.16,'triangle',.1)},
 power:()=>{tone(300,.4,'sawtooth',.08,0,900);tone(mf(91),.3,'sine',.1,now()+.25)},
 sup:()=>{nz(.5,.2,0,400,false,3500);tone(200,.5,'sawtooth',.1,0,1000);tone(mf(96),.3,'square',.07,now()+.35)},

 ooh:()=>{for(let i=0;i<6;i++){const f=150+Math.random()*110;vox(f,f*.82,.85,.05,now()+Math.random()*.08,480+Math.random()*120)}},
 cheer:v=>{const k=v||1;nz(1.1*k,.09,0,1400,false,3000);for(let i=0;i<6;i++){const f=230+Math.random()*160;vox(f,f*1.35,.55,.035,now()+Math.random()*.15,1000+Math.random()*400)}for(let i=0;i<10*k;i++)nz(.03,.12,now()+.05+Math.random()*.9*k,1800)},
 goal:()=>{[79,84,88,91,96].forEach((m,i)=>tone(mf(m),.12,'square',.06,now()+i*.07));tone(mf(72),.5,'triangle',.15,now())},
 gold:()=>{[88,93,96,100].forEach((m,i)=>tone(mf(m),.18,'sine',.09,now()+i*.05))},
 boing:()=>tone(220,.25,'sine',.14,0,620),
 squeak:()=>{tone(1300,.08,'sine',.05,0,1700);tone(1250,.08,'sine',.05,now()+.14,1600)},
 paper:()=>nz(.25,.1,0,2500,false,6000),
 throw:()=>{nz(.24,.16,0,500,false,2600);tone(260,.18,'triangle',.05,0,620)},
 bounce:v=>{tone(150+(v||0)*60,.1,'triangle',.12,0,80);nz(.05,.07,0,900,true,300)},
 thud:()=>{tone(110,.14,'sine',.2,0,55);nz(.06,.08,0,600,true,200)},
 bonk:()=>{tone(210,.12,'square',.07,0,120)},
 rim:()=>{tone(1500,.2,'triangle',.1,0,1150);tone(2250,.12,'sine',.05)},
 clunk:()=>{tone(130,.2,'square',.1,0,70);nz(.1,.12,0,700,true,200)},
 in:()=>{SFX.clunk();tone(mf(88),.22,'sine',.12,now()+.05)},
 swish:()=>{nz(.32,.2,0,2000,false,6500);tone(mf(91),.25,'sine',.12,now()+.1);tone(mf(95),.35,'sine',.1,now()+.18)},
 bank:()=>{SFX.clunk();[76,83,88,95].forEach((m,i)=>tone(mf(m),.12,'square',.05,now()+.04+i*.07))},
 trick:()=>{SFX.clunk();[72,79,84,91].forEach((m,i)=>tone(mf(m),.12,'triangle',.1,now()+.04+i*.06))},
 miss:()=>{tone(200,.22,'sawtooth',.045,0,110)},
 streak:m=>{[76,81,85,88].slice(0,Math.min(4,m+1)).forEach((n,i)=>tone(mf(n+12),.1,'square',.05,now()+i*.06))},
 tick:()=>tone(1250,.04,'square',.04),
 stage:()=>{[72,76,79,84].forEach((m,i)=>{tone(mf(m),.14,'square',.06,now()+i*.09);tone(mf(m-12),.14,'triangle',.12,now()+i*.09)})},
 buzz:()=>{tone(150,.5,'sawtooth',.1,0,110);tone(300,.5,'square',.05,0,220)},
 select:()=>tone(880,.06,'square',.05),
 pause:()=>{tone(520,.07,'square',.05);tone(390,.09,'square',.05,now()+.07)},
 star:i=>{const b=[76,81,88][i||0];tone(mf(b),.25,'square',.07);tone(mf(b+12),.3,'triangle',.1)},
 clear:()=>{[72,72,72,76,79,84,79,84,88].forEach((m,i)=>{tone(mf(m),.15,'square',.06,now()+i*.1);tone(mf(m-24),.15,'triangle',.18,now()+i*.1)})},
 fail:()=>{[69,66,62,57].forEach((m,i)=>{tone(mf(m),.3,'square',.06,now()+i*.22)})}
};
function sfx(n,a){try{if(AC&&SFX[n])SFX[n](a)}catch(e){}}
const KL={K:{w:1.0,p:[[[0,0],[.44,0],[.44,1],[0,1]],[[.36,.38],[.64,1],[1,1],[.70,.38]],[[.36,.62],[.66,.62],[1.02,0],[.62,0]]]},
 E:{w:.84,p:[[[0,0],[.46,0],[.46,1],[0,1]],[[0,.77],[1,.77],[1,1],[0,1]],[[0,.39],[.9,.39],[.9,.61],[0,.61]],[[0,0],[1,0],[1,.23],[0,.23]]]},
 I:{w:.44,p:[[[0,0],[1,0],[1,1],[0,1]]]},
 M:{w:1.32,p:[[[0,0],[.32,0],[.32,1],[0,1]],[[.68,0],[1,0],[1,1],[.68,1]],[[0,1],[.34,1],[.5,.6],[.66,1],[1,1],[.64,.22],[.36,.22]]]}};
const KG={wedgeA:30,r0:1.14,r1:1.96,span:34,gap:.1};
function keimLogoPolys(){const tot=['K','E','I','M'].reduce((a,c)=>a+KL[c].w,0)+KG.gap*3,deg=KG.span*2/tot,out=[];let a=-KG.span;
 const P=(ang,r)=>{const q=ang*Math.PI/180;return[r*Math.sin(q),-r*Math.cos(q)]};
 ['K','E','I','M'].forEach(ch=>{const L=KL[ch],a0=a,a1=a+L.w*deg;L.p.forEach(poly=>{const pts=[];for(let i=0;i<poly.length;i++){const [u0,v0]=poly[i],[u1,v1]=poly[(i+1)%poly.length];for(let s=0;s<8;s++){const u=u0+(u1-u0)*s/8,v=v0+(v1-v0)*s/8;pts.push(P(a0+u*(a1-a0),KG.r0+v*(KG.r1-KG.r0)))}}out.push(pts)});a=a1+KG.gap*deg});
 const wd=[[0,0]];for(let s=0;s<=20;s++)wd.push(P(-KG.wedgeA+s*KG.wedgeA*2/20,1));out.push(wd);return out}
const KPOLY=keimLogoPolys();
const KBOX=(()=>{let x0=9,x1=-9,y0=9,y1=-9;KPOLY.forEach(p=>p.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}));return{x0,x1,y0,y1,w:x1-x0,h:y1-y0}})();
function keimLogo(ctx,x,y,w,h,col){const s=Math.min(w/KBOX.w,h/KBOX.h),ox=x+(w-KBOX.w*s)/2-KBOX.x0*s,oy=y+(h-KBOX.h*s)/2-KBOX.y0*s;ctx.save();ctx.fillStyle=col;
 KPOLY.forEach(p=>{ctx.beginPath();p.forEach(([px,py],i)=>i?ctx.lineTo(ox+px*s,oy+py*s):ctx.moveTo(ox+px*s,oy+py*s));ctx.closePath();ctx.fill()});ctx.restore()}
function keimLogoSVG(){return KPOLY.map(p=>'<path d="M'+p.map(([x,y])=>(x*100).toFixed(1)+' '+(y*100).toFixed(1)).join(' L')+' Z"/>').join('')}

// fam: P paint, M prep, S safety, T tools. spin: tumble range. snd: landing sound
const ITEMS=[

 if(p.role==='aim'&&S&&S.aim&&S.aim.id===id){const v=aimVec();S.aim=null;if(v&&canAim()){if(v.len>=LMIN)throwItem(v.ang,v.pull,{curve:v.curve,sup:v.sup});else if(!flightAction()&&v.len>6)S.hint=Math.max(S.hint,2)}}}
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();initAudio();try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=lpos(e);onDown(e.pointerId,x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=lpos(e);if(PT.has(e.pointerId))e.preventDefault();onMove(e.pointerId,x,y)});
cv.addEventListener('pointerup',e=>onUp(e.pointerId));cv.addEventListener('pointercancel',e=>{const p=PT.get(e.pointerId);if(p&&p.role==='aim'&&S)S.aim=null;PT.delete(e.pointerId)});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const KEYS={};
addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.code;
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(k)>=0&&e.target===document.body)e.preventDefault();
 if(e.repeat&&k!=='ArrowUp'&&k!=='ArrowDown')return;initAudio();
 if(k==='KeyM'){muteBtn.click();return}
 if(k==='KeyP'||k==='Escape'){if(G.how){closeHow();return}if(G.st==='play')togglePause();else if(G.st==='results')goTitle();return}
 if(k==='Enter'||(k==='Space'&&(G.st==='title'||G.st==='results'||G.how))){
  if(G.how)closeHow();else if(G.st==='title')startPressed();else if(G.st==='results')beginPlay();else if(G.st==='play'&&G.paused)togglePause();return}
 if(k==='KeyF'){startFever();return}
 if(k==='KeyX'){flightAction();return}
 if(k==='KeyQ')KEYS.q=true;if(k==='KeyE')KEYS.e=true;
 if(k==='KeyW'||k==='ArrowUp')KEYS.up=true;if(k==='KeyS'||k==='ArrowDown')KEYS.down=true;
 if(k==='Space'&&canAim()&&S.hand!==null&&S.loadT<=0&&!S.charging){S.charging=true;S.ct=0;S.charge=0;S.sup=0}});
addEventListener('keyup',e=>{const k=e.code;if(k==='KeyW'||k==='ArrowUp')KEYS.up=false;if(k==='KeyS'||k==='ArrowDown')KEYS.down=false;if(k==='KeyQ')KEYS.q=false;if(k==='KeyE')KEYS.e=false;
 if(k==='Space'&&S&&S.charging){S.charging=false;if(canAim())throwItem(S.kang,Math.max(.12,S.charge)*LMAX,{sup:S.charge>=1&&S.sup>=1})}});
addEventListener('blur',()=>{if(G.st==='play'&&!G.paused&&!G.how)togglePause();KEYS.up=KEYS.down=KEYS.q=KEYS.e=false;if(S){S.charging=false;S.aim=null}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.st==='play'&&!G.paused&&!G.how)togglePause()});
document.getElementById('pausebtn').addEventListener('click',e=>{if(G.st==='play')togglePause();e.currentTarget.blur()});
